# .github/workflows/quality-gate.yml
# Phase 4 / Đợt 4C — the quality gate.
#
# Two things must hold before a change reaches production:
#   1. The offline math suites pass (perception consensus, solver verification,
#      the TypeSafe guard, the math regression benchmark). They need no API key
#      and no network, so they can gate every push.
#   2. Every `:free` OpenRouter slug we actually call still exists. A dead slug
#      does NOT fail over — OpenRouter rejects the whole request (HTTP 400) —
#      which is exactly how the vision tier silently died before.
name: Quality gate
on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/scripts/**"
      - "frontend/next.config.mjs"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/quality-gate.yml"
  pull_request:
  schedule:
    # Free-tier catalogs change without notice, so check daily even when the
    # code is quiet.
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  offline-suites:
    name: Offline math + guard suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately NOT the full requirements.txt: these suites never import
      # main.py, so pulling sentence-transformers/torch would only burn CI
      # minutes. Add packages here as new suites need them.
      - name: Install test dependencies
        run: pip install "sympy>=1.12" "numpy>=1.26" "Pillow>=10.0.0" "httpx>=0.27.0" "pydantic>=2" "json-repair>=0.30.0" "gradio_client>=2.0.0" "fsrs>=6.0.0"

      - name: Perception — MathReader (dual-read consensus + SymPy gate)
        working-directory: backend
        run: python test_math_reader.py

      - name: Solving — MathSolver (tools + deterministic checks + repair)
        working-directory: backend
        run: python test_math_solver.py

      - name: Spaced repetition — FSRS scheduler
        working-directory: backend
        run: python test_fsrs_scheduler.py

      # Phase 4 / guide item 2.8 — the question bank: parsing rules for the
      # shapes real dumps use, the identity rule that makes imports idempotent,
      # the licence guard, and a full import twice into a TEMP database.
      # Pure stdlib, so it adds no dependency to this job.
      - name: Question bank — VNHSGE normalisation + import
        working-directory: backend
        run: python test_vnhsge_bank.py

      # Roadmap Q4/2026 item 2 — the GeoGebra exporter. Not "a file came out":
      # the suite re-opens the .ggb and holds geogebra.xml against the GeoGebra
      # manual (documented tags, documented element types, dependency order,
      # deterministic bytes), because a worksheet that silently loses an object
      # is worse than no export at all. Stdlib only, so it adds no dependency.
      - name: Export — MathViz → GeoGebra worksheet (.ggb)
        working-directory: backend
        run: python test_geogebra_export.py

      - name: Anti-hallucination — TypeSafe guard
        working-directory: backend
        run: python test_typesafe_guard.py

      # Đợt 4H-2 — the request budgets behind the 2026-09-28 production failure
      # ("ERR_FAILED + phantom CORS" on POST /api/chat). Pure stdlib, so it adds
      # no dependency, and it checks the WIRING in main.py too: the deadline
      # middleware must stay registered INSIDE CORSMiddleware (that is what puts
      # the CORS headers on the 504), each expensive stage must stay wrapped in
      # its clamped budget, and /api/health must not go back to advertising an
      # OCR engine that is not installed.
      - name: Chat budgets — deadline guard + per-stage budgets
        working-directory: backend
        run: python test_chat_budget.py

      - name: Math regression benchmark (ground truth vs answers)
        working-directory: backend
        run: python tests/eval_math_regression.py

  free-catalog:
    name: Free-tier slugs still valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27.0"
      - name: Every :free slug we call must exist on OpenRouter
        run: python backend/scripts/check_free_catalog.py

  frontend-syntax:
    name: Frontend syntax (tsc, no bundler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The TypeScript parser catches duplicate top-level declarations and
      # malformed JSX — the two errors that broke a production Vercel build
      # while `node --check` and a Babel parse both happily accepted the file.
      # `checkJs` stays off, so this job enforces SYNTAX only and needs no deps.
      - name: Parse every src/**/*.js|jsx
        working-directory: frontend
        run: npx -y -p typescript@5 tsc -p tsconfig.syntax.json

      # Deeper gate, scoped to the SERVER API ROUTES: with checkJs ON the
      # compiler reports undefined identifiers by name. Proven on the real bug:
      # `Cannot find name 'request'` at the line that answered 500 in
      # production (commit c4d5af3). src/lib is excluded on purpose — legacy
      # stale JSDoc there would drown the signal in noise.
      - name: Type-check the API routes (undefined names included)
        working-directory: frontend
        run: npx -y -p typescript@5 tsc -p tsconfig.checkjs.json

      # The gate for the fallback that broke the home page in production
      # (2026-09-27): a bundle shipped with `NEXT_PUBLIC_API_URL ||
      # "http://localhost:8000"` and the enforced CSP blocked every request.
      # Every module must resolve the backend through src/lib/apiBase.js.
      - name: No hard-coded localhost API base in src/
        working-directory: frontend
        run: node scripts/check-api-base.mjs

      # Đợt 4H-2 — the client half of the same production failure. These three
      # node guards need no dependencies (they import the pure modules from
      # src/lib directly), so they run in the syntax job and cost a second:
      #   * imageDownscale: the pixel budget we upload with, pinned against
      #     backend/security_limits.py, plus "the upload path cannot go back to a
      #     bare FileReader.readAsDataURL" (the 4-5 MB payload that outlived the
      #     proxy — 23 checks);
      #   * chatErrors: every failure the browser can produce maps to its own
      #     actionable Vietnamese message, and the client timeout stays ABOVE the
      #     server budget so the server's real 504 is what the student reads
      #     (the incident was reported as a CORS error — 25 checks);
      #   * threeApi: no deprecated THREE.Clock anywhere (three r183+ warns), and
      #     the Timer migration keeps its update()/connect()/dispose() contract
      #     (6 checks).
      - name: Image downscale + upload cap (no 5 MB payloads)
        working-directory: frontend
        run: node scripts/check-image-downscale.mjs

      - name: Chat failure messages + timeout ordering
        working-directory: frontend
        run: node scripts/check-chat-errors.mjs

      - name: No deprecated Three.js APIs (THREE.Clock → THREE.Timer)
        working-directory: frontend
        run: node scripts/check-three-api.mjs

  frontend-build:
    name: Frontend build (real bundler + Penrose trios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The integration plan requires one REAL bundler pass before Penrose
      # ships (@penrose/core pulls ~2.7 MB of JS into a client chunk, and the
      # local dev machine cannot complete a build). It is also the only gate
      # that would have caught the duplicate-declaration bug that broke a
      # Vercel build while every syntax checker stayed green.
      # No secrets needed: the public config lives in src/lib/firebase.js.
      - name: Install dependencies (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Fast and Penrose-specific, so it runs before the slow build: it
      # compiles every trio and fails if the optimizer leaves a constraint
      # unsatisfied (that is how the isConvex dead-end was found).
      - name: Penrose trios (compile + optimizer residual)
        working-directory: frontend
        run: node scripts/check-penrose-trios.mjs

      - name: next build (Turbopack)
        working-directory: frontend
        run: pnpm build