name: Build Android packages

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Preview APK or signed release APK + AAB'
        type: choice
        options: [preview, release]
        default: preview

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_VARIANT: ${{ inputs.variant || 'preview' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install npm dependencies
        run: |
          npm install --global npm@11.6.1
          npm ci --no-audit --no-fund
        working-directory: mobile

      - name: Check assets, TypeScript and tests
        run: npm run check
        working-directory: mobile

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: mobile/android

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Restore release signing key
        if: env.BUILD_VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bingmath-upload.keystore"

      - name: Build APK (and AAB for signed release)
        run: npm run "build:android:$BUILD_VARIANT" -- --stacktrace -PBINGMATH_VERSION_CODE="$((GITHUB_RUN_NUMBER + 2))"
        working-directory: mobile
        env:
          BINGMATH_UPLOAD_STORE_FILE: ${{ runner.temp }}/bingmath-upload.keystore
          BINGMATH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BINGMATH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BINGMATH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK signature and packaged JavaScript
        run: |
          apk="mobile/android/app/build/outputs/apk/$BUILD_VARIANT/app-$BUILD_VARIANT.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          unzip -l "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/index.android.bundle' "$RUNNER_TEMP/apk-files.txt"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: bingmath-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/${{ env.BUILD_VARIANT }}/*.apk*
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bingmath-upload.keystore"
