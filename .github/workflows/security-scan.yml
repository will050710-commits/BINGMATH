name: Security scans

# Phase 3: secret scanning + dependency audits.
# gitleaks runs on the full history (the answer-key/db purge means old commits
# must stay clean too); the dependency audits are report-only for now so an
# unrelated upstream CVE cannot block a deploy — tighten by removing the
# `continue-on-error` lines once the reports are clean.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scan every commit, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --config .gitleaks.toml --redact --no-banner --exit-code 1

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pip-audit
      - name: Audit backend/requirements.txt
        continue-on-error: true     # report-only in Phase 3
        run: pip-audit -r backend/requirements.txt --progress-spinner off

  node-deps:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production dependencies
        working-directory: frontend
        continue-on-error: true     # report-only in Phase 3
        run: pnpm audit --prod
