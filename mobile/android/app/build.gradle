apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def appVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def releaseValue = { name -> providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrElse("") }
def releaseStoreFile = releaseValue("BINGMATH_UPLOAD_STORE_FILE")
def releaseStorePassword = releaseValue("BINGMATH_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = releaseValue("BINGMATH_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = releaseValue("BINGMATH_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isEmpty() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bingmathmobile"
    defaultConfig {
        applicationId "com.bingmathmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode providers.gradleProperty("BINGMATH_VERSION_CODE").orElse("2").get().toInteger()
        versionName appVersion
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    signingConfigs {
        // Use the standard SDK debug keystore, created by AGP when absent.
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Standalone test APK with bundled JS and production URLs, not a store release.
        preview {
            initWith release
            signingConfig signingConfigs.debug
            versionNameSuffix "-preview"
            matchingFallbacks = ["release"]
        }
    }
}

def validateReleaseCredentials = tasks.register("validateReleaseCredentials") {
    doLast {
        if (!hasReleaseSigning || !file(releaseStoreFile).isFile()) {
            throw new GradleException("Release requires BINGMATH_UPLOAD_STORE_FILE, BINGMATH_UPLOAD_STORE_PASSWORD, BINGMATH_UPLOAD_KEY_ALIAS and BINGMATH_UPLOAD_KEY_PASSWORD. See SETUP.md; use assemblePreview for a test APK.")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn validateReleaseCredentials
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("io.github.react-native-community:jsc-android:2026004.+")
    }
}
