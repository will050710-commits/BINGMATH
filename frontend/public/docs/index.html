<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg: #040816;
      --card: rgba(14, 24, 52, 0.78);
      --border: rgba(56, 189, 248, 0.28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #c084fc;
      --green: #34d399;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 24px 16px 80px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(8,145,178,0.22), rgba(124,58,237,0.18));
      border: 1.5px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
      position: sticky;
      top: 10px;
      z-index: 50;
      background: rgba(4, 8, 22, 0.9);
      backdrop-filter: blur(16px);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    input[type="search"] {
      flex: 1;
      min-width: 240px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .filter-btn {
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--primary);
      color: var(--primary);
    }
    .stats { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .file-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .file-title { font-size: 16px; font-weight: 800; color: var(--primary); font-family: monospace; }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
    }
    .badge-WEB-MOBILE { color: var(--accent); }
    .badge-RN-MOBILE { color: var(--green); }
    .badge-BACKEND { color: var(--primary); }
    .badge-BE-TEST { color: var(--gold); }
    .file-desc { color: #cbd5e1; font-size: 13.5px; margin-bottom: 12px; }
    .fn-list { display: flex; flex-direction: column; gap: 6px; }
    .fn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }
    .fn-name { font-family: monospace; font-weight: 700; color: #f8fafc; }
    .fn-meta { font-size: 11px; color: var(--gold); font-family: monospace; }
    .fn-desc { color: var(--muted); flex: 1; min-width: 220px; }
  </style>
</head>

      <button class="filter-btn" data-filter="Mobile Web (Next.js)">Mobile Web</button>
      <button class="filter-btn" data-filter="Mobile App (React Native)">Mobile RN</button>
      <button class="filter-btn" data-filter="Backend Core (FastAPI)">Backend Core</button>
      <button class="filter-btn" data-filter="Backend Tests & Training">Tests & Training</button>

    <div id="cardsRoot"></div>

    let currentFilter = "ALL";
    let currentQuery = "";

    const cardsRoot = document.getElementById("cardsRoot");
    const statsBar = document.getElementById("statsBar");
    const searchInput = document.getElementById("searchInput");

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function render() {
      const q = currentQuery.trim().toLowerCase();
      let totalFiles = 0;
      let totalFns = 0;
      const htmlParts = [];

      for (const item of DOC_DATA) {
        if (currentFilter !== "ALL" && item.section !== currentFilter) continue;
        const fileMatch = item.file.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        const matchedFns = item.functions.filter(fn =>
          !q || fileMatch || fn.name.toLowerCase().includes(q) || fn.desc.toLowerCase().includes(q)
        );
        if (q && !fileMatch && matchedFns.length === 0) continue;

        totalFiles++;
        totalFns += matchedFns.length;

        const fnRows = matchedFns.map(fn => `
          <div class="fn-row">
            <span class="fn-name">${escapeHtml(fn.name)}</span>
            <span class="fn-meta">[${escapeHtml(fn.kind)} · L${fn.line}]</span>
            <span class="fn-desc">${escapeHtml(fn.desc)}</span>
          </div>
        `).join("");

        htmlParts.push(`
          <section class="file-card">
            <div class="file-header">
              <span class="file-title">${escapeHtml(item.file)}</span>
              <span class="badge badge-${escapeHtml(item.badge)}">${escapeHtml(item.section)}</span>
            </div>
            <p class="file-desc">${escapeHtml(item.desc)}</p>
            <div class="fn-list">${fnRows || '<div class="fn-row"><span class="fn-desc">Module constants / TypeScript interfaces definition file.</span></div>'}</div>
          </section>
        `);
      }

      statsBar.textContent = `Showing ${totalFiles} files and ${totalFns} functions/classes`;
      cardsRoot.innerHTML = htmlParts.join("");
    }

    searchInput.addEventListener("input", (e) => {
      currentQuery = e.target.value;
      render();
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        render();
      });
    });

    render();
  </script>
</body>
</html>
