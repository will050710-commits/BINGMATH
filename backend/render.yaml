# render.yaml — DuoMath backend deploy config
# To use FastAPI (main.py), change startCommand to:
#   uvicorn main:app --host 0.0.0.0 --port $PORT
# To stay on Flask (server.py), keep:
#   gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4

services:
  - type: web
    name: duomath-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Phase 0 security fix: single worker + proxy headers. The rate limiter and
    # the in-memory MRM multiplayer state are per-process, so two workers both
    # halved the effective limits and split realtime game state.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SELF_URL
        sync: false
      # ── Added: these were used by main.py / vision_agent.py but not
      #    declared here, so Render's dashboard had no slot for them and a
      #    fresh deploy would silently run with GEMINI_API_KEY/
      #    OPENROUTER_API_KEY unset. Secrets stay sync:false (set their
      #    values in the Render dashboard, never in this file); the two
      #    model-name vars are plain config, not secrets, so they're
      #    checked in with the confirmed-free defaults from this patch.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: OPENROUTER_API_KEY
        sync: false
      # ── Free-tier model ladders (Phase 4, Đợt 3 — verified live 2026-09-26) ──
      # Ranked by the Artificial Analysis indices OpenRouter publishes per model.
      # The previous values were DEAD slugs (no :free variant exists any more),
      # so every vision/repair call failed before reaching a provider.
      - key: OPENROUTER_VISION_MODEL
        value: "qwen/qwen3.8-27b:free"
      - key: OPENROUTER_VISION_FALLBACK_MODELS
        value: "google/gemma-4-31b-it:free,dots-studio/dots-3-note-preview:free,thinkingmachines/inkling:free,openrouter/free"
      - key: OPENROUTER_CHAT_MODELS
        value: "qwen/qwen3.8-27b:free,nvidia/nemotron-3-ultra-550b-a55b:free,poolside/laguna-s-2.1:free,nvidia/nemotron-3-super-120b-a12b:free,openrouter/free"
      - key: OPENROUTER_TRANSLATE_MODELS
        value: "qwen/qwen3.8-27b:free,nvidia/nemotron-3-ultra-550b-a55b:free,poolside/laguna-s-2.1:free,openrouter/free"
      # Text-only JSON repair tier (MathViz). Its old default
      # (minimax/minimax-m3:free) no longer exists on the free tier.
      - key: OPENROUTER_REPAIR_MODEL
        value: "qwen/qwen3.8-27b:free"
      # Which provider answers a /api/translate request first. Default keeps the
      # strongest free OpenRouter model in front; Gemini and Groq are fallbacks.
      - key: TRANSLATE_TIER_ORDER
        value: "openrouter,gemini,groq"
      # Guard for the shared free quota (50 req/day without credits, 1000/day
      # after $10 of credits). 0 disables the guard.
      - key: OPENROUTER_DAILY_BUDGET
        value: "800"
      # ── Đợt 4A — Verified MathReader (perception cross-check) ──────────────
      # Two readers from DIFFERENT model families; the second is only used when
      # the first is unsure (AI_DUAL_READ=auto), always (always), or never
      # (never = exactly the pre-4A single-read behaviour, useful as a rollback).
      - key: MATH_READER_MODELS
        value: "qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free"
      - key: MATH_READER_TIEBREAK_MODEL
        value: "dots-studio/dots-3-note-preview:free"
      - key: AI_DUAL_READ
        value: "auto"
      # ── Đợt 4B — tool-calling solver + verification before the answer ──────
      # The solver may call exact SymPy tools; a critic from ANOTHER family
      # judges the finished answer, and one repair round runs when a check
      # fails. MATH_VERIFY_MODE=auto verifies only when there is something
      # concrete to check (image perception or an extractable answer).
      - key: MATH_TOOLS_MODEL
        value: "qwen/qwen3.8-27b:free,nvidia/nemotron-3-ultra-550b-a55b:free,openrouter/free"
      - key: MATH_CRITIC_MODEL
        value: "google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free,openrouter/free"
      - key: MATH_VERIFY_MODE
        value: "auto"
      - key: VISION_AGENT_ENABLED
        value: "true"
      # ── Phase 0 security hardening (synced from the Render dashboard) ──
      # Explicit CORS allowlist — replaces the old `*.vercel.app|render.com|
      # netlify.app` regex that let attacker-controlled subdomains call the API.
      - key: ALLOWED_ORIGINS
        sync: false
      # Comma-separated emails promoted to admin on boot. Only *pre-existing*
      # accounts are ever promoted (the hard-coded email bypass was removed).
      - key: ADMIN_EMAILS
        sync: false
      # Optional: comma-separated Host headers the API accepts (defaults cover
      # *.onrender.com, localhost and 127.0.0.1). Add a custom domain here.
      - key: ALLOWED_HOSTS
        sync: false
      # Optional: retention window in days for anonymous sessions/AI materials.
      - key: DATA_RETENTION_DAYS
        value: "30"
